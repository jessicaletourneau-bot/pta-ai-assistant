
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Windham PTA Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                'Segoe UI', Roboto, sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
        }

        /* Floating Chat Button */

        .chat-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #EC4899, #8B5CF6);
            color: white;
            border: none;
            border-radius: 9999px;
            padding: 14px 21px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 9999;
            transition: transform 0.2s ease;
        }

        .chat-toggle-btn:hover {
            transform: scale(1.04);
        }

        /* Chat Window */

        .chat-container {
            position: fixed;
            bottom: 85px;
            right: 20px;
            width: 380px;
            height: 540px;
            max-height: calc(100vh - 110px);
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            z-index: 9999;
        }

        .chat-container.open {
            display: flex;
        }

        /* Header */

        .chat-header {
            background: #f1f5f9;
            padding: 14px 16px;
            font-weight: 600;
            font-size: 15px;
            color: #1e293b;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .new-chat-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 9px;
            font-size: 12px;
            color: #475569;
            cursor: pointer;
        }

        .new-chat-btn:hover {
            background: #e2e8f0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 23px;
            cursor: pointer;
            color: #64748b;
            padding: 0 3px;
        }

        /* Messages */

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.55;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.user {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            background: #ffffff;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #e2e8f0;
        }

        .message.error {
            color: #b91c1c;
            border-color: #fecaca;
            background: #fef2f2;
        }

        .typing {
            color: #64748b;
            font-style: italic;
        }

        /* Input Area */

        .chat-input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            min-width: 0;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9999px;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area input:focus {
            border-color: #3b82f6;
        }

        .chat-input-area button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-input-area button:hover {
            background: #2563eb;
        }

        .chat-input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chat-footer {
            text-align: center;
            padding: 7px;
            font-size: 10px;
            color: #94a3b8;
            background: #ffffff;
        }

        /* Mobile Display */

        @media (max-width: 480px) {
            .chat-container {
                width: calc(100vw - 20px);
                height: calc(100dvh - 100px);
                max-height: none;
                right: 10px;
                bottom: 75px;
                border-radius: 14px;
            }

            .chat-toggle-btn {
                right: 12px;
                bottom: 12px;
            }

            .chat-messages {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Chat Button -->

    <button
        class="chat-toggle-btn"
        id="chat-toggle"
        type="button"
        aria-label="Open PTA Assistant"
        aria-expanded="false"
        aria-controls="chat-window">

        <span>✨ Ask PTA Assistant</span>

    </button>


    <!-- Chat Window -->

    <div
        id="chat-window"
        class="chat-container"
        role="dialog"
        aria-label="Windham PTA Assistant">

        <!-- Header -->

        <div class="chat-header">

            <span>Windham PTA Assistant</span>

            <div class="header-actions">

                <button
                    class="new-chat-btn"
                    id="new-chat-btn"
                    type="button">
                    New Chat
                </button>

                <button
                    class="close-btn"
                    id="close-chat-btn"
                    type="button"
                    aria-label="Close chat">
                    &times;
                </button>

            </div>

        </div>


        <!-- Messages -->

        <div
            id="chat-messages"
            class="chat-messages"
            aria-live="polite">

        </div>


        <!-- Input -->

        <form id="chat-form" class="chat-input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Ask a question..."
                autocomplete="off"
                maxlength="2000"
                aria-label="Your question"
                required>

            <button
                type="submit"
                id="send-button">
                Send
            </button>

        </form>

        <div class="chat-footer">
            Windham PTA • AI-powered assistance
        </div>

    </div>


    <script>

        // ==========================================
        // CONFIGURATION
        // ==========================================

        const STORAGE_KEY = "windham_pta_chat";

        const API_URL = "/api/chat";

        const MAX_STORED_MESSAGES = 50;

        const MAX_API_MESSAGES = 12;


        // ==========================================
        // ELEMENT REFERENCES
        // ==========================================

        const chatWindow =
            document.getElementById("chat-window");

        const toggleButton =
            document.getElementById("chat-toggle");

        const closeButton =
            document.getElementById("close-chat-btn");

        const newChatButton =
            document.getElementById("new-chat-btn");

        const messagesDiv =
            document.getElementById("chat-messages");

        const inputField =
            document.getElementById("user-input");

        const chatForm =
            document.getElementById("chat-form");

        const sendButton =
            document.getElementById("send-button");


        // ==========================================
        // WELCOME MESSAGE
        // ==========================================

        const welcomeMessage = {
            role: "model",
            text: "Hello! Welcome to Windham PTA! 👋\n\nI'm your PTA assistant. I can help answer questions about membership, events, volunteering, fundraising, and PTA programs.\n\nWhat can I help you with today?"
        };


        // ==========================================
        // CONVERSATION STATE
        // ==========================================

        let messages = loadMessages();

        let sending = false;


        // ==========================================
        // LOAD SAVED CONVERSATION
        // ==========================================

        function loadMessages() {

            try {

                const saved =
                    localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    return [{ ...welcomeMessage }];
                }

                const parsed = JSON.parse(saved);

                if (
                    !Array.isArray(parsed) ||
                    !parsed.every(message =>
                        message &&
                        ["user", "model"].includes(message.role) &&
                        typeof message.text === "string"
                    )
                ) {
                    return [{ ...welcomeMessage }];
                }

                return parsed.slice(-MAX_STORED_MESSAGES);

            } catch (error) {

                console.error(
                    "Unable to load chat history:",
                    error
                );

                return [{ ...welcomeMessage }];

            }

        }


        // ==========================================
        // SAVE CONVERSATION
        // ==========================================

        function saveMessages() {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        messages.slice(-MAX_STORED_MESSAGES)
                    )
                );

            } catch (error) {

                console.error(
                    "Unable to save chat history:",
                    error
                );

            }

        }


        // ==========================================
        // DISPLAY CONVERSATION
        // ==========================================

        function renderMessages() {

            messagesDiv.innerHTML = "";

            messages.forEach(message => {

                const div =
                    document.createElement("div");

                div.className =
                    "message " +
                    (message.role === "user"
                        ? "user"
                        : "bot");

                div.textContent = message.text;

                messagesDiv.appendChild(div);

            });

            scrollToBottom();

        }


        // ==========================================
        // SCROLL TO LATEST MESSAGE
        // ==========================================

        function scrollToBottom() {

            messagesDiv.scrollTop =
                messagesDiv.scrollHeight;

        }


        // ==========================================
        // OPEN / CLOSE CHAT
        // ==========================================

        function openChat() {

            chatWindow.classList.add("open");

            toggleButton.setAttribute(
                "aria-expanded",
                "true"
            );

            renderMessages();

            inputField.focus();

        }


        function closeChat() {

            chatWindow.classList.remove("open");

            toggleButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        toggleButton.addEventListener(
            "click",
            () => {

                if (chatWindow.classList.contains("open")) {
                    closeChat();
                } else {
                    openChat();
                }

            }
        );


        closeButton.addEventListener(
            "click",
            closeChat
        );


        // ==========================================
        // START NEW CONVERSATION
        // ==========================================

        function clearChat() {

            if (sending) return;

            const confirmed = window.confirm(
                "Start a new conversation? Your current chat history will be cleared."
            );

            if (!confirmed) return;

            messages = [{ ...welcomeMessage }];

            saveMessages();

            renderMessages();

            inputField.focus();

        }


        newChatButton.addEventListener(
            "click",
            clearChat
        );


        // ==========================================
        // SEND MESSAGE
        // ==========================================

        async function sendMessage() {

            const text = inputField.value.trim();

            if (!text || sending) return;

            sending = true;

            inputField.value = "";

            // Add visitor message

            messages.push({
                role: "user",
                text: text
            });

            saveMessages();

            renderMessages();


            // Show temporary typing indicator

            const typingDiv =
                document.createElement("div");

            typingDiv.className =
                "message bot typing";

            typingDiv.textContent =
                "PTA Assistant is thinking...";

            messagesDiv.appendChild(typingDiv);

            scrollToBottom();


            // Disable sending while waiting

            sendButton.disabled = true;

            sendButton.textContent = "Thinking...";

            inputField.disabled = true;


            try {

                // Send the last 12 messages to Vercel

                const conversation =
                    messages.slice(-MAX_API_MESSAGES);


                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        messages: conversation
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to get a response from the AI."
                    );

                }


                if (
                    !data.reply ||
                    typeof data.reply !== "string"
                ) {

                    throw new Error(
                        "The AI returned an empty response."
                    );

                }


                // Save the assistant response

                messages.push({

                    role: "model",

                    text: data.reply

                });

                saveMessages();

                renderMessages();


            } catch (error) {

                console.error(
                    "Chat error:",
                    error
                );


                // Display error without adding it
                // to the actual conversation history

                const errorDiv =
                    document.createElement("div");

                errorDiv.className =
                    "message bot error";

                errorDiv.textContent =
                    "Sorry, something went wrong.\n\n" +
                    error.message +
                    "\n\nPlease try again.";

                messagesDiv.appendChild(errorDiv);

                scrollToBottom();


            } finally {

                sending = false;

                sendButton.disabled = false;

                sendButton.textContent = "Send";

                inputField.disabled = false;

                inputField.focus();

            }

        }


        // ==========================================
        // FORM SUBMISSION
        // ==========================================

        chatForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                sendMessage();

            }
        );


        // ==========================================
        // INITIALIZE CHAT
        // ==========================================

        renderMessages();

    </script>

</body>
</html>
